name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, lint, test, migrate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: derp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d derp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway service database, never a development or production URL.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/derp_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @derp/api prisma:generate

      - name: Build all packages
        run: pnpm -r build

      - name: Lint all packages
        run: pnpm -r lint

      - name: Run unit tests
        run: pnpm -r test --if-present

      # Do not run prisma/seed.ts or scripts/prisma-deploy.js here: both have
      # production-oriented seed/baseline behavior. A new DB must migrate as-is.
      - name: Apply historical migrations to clean database
        run: pnpm prisma migrate deploy --schema=prisma/schema.prisma

      - name: Check migration history
        run: pnpm prisma migrate status --schema=prisma/schema.prisma

      # The historical schema still has documented extra legacy structures.
      # Pin the exact residual diff so a new mismatch cannot pass unnoticed.
      - name: Detect unexpected migration/schema divergence
        run: |
          pnpm prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script > "$RUNNER_TEMP/replay-diff.sql"
          if ! printf '%s  %s\n' '90ac7d41b0a77b459e489c07694a80aa7a4f51195f05115a4b68442ba4dd14ba' "$RUNNER_TEMP/replay-diff.sql" | sha256sum --check --status; then
            echo 'Fresh replay differs from the reviewed legacy schema gap. Inspect the SQL below; do not baseline it silently.'
            cat "$RUNNER_TEMP/replay-diff.sql"
            exit 1
          fi
